# tsbWEB - what an operator may change without recompiling.
#
# This file is looked for beside the jar. During development the program runs from a folder of
# class files and has no jar to sit beside, and then the values in Sub Main apply.
#
# Everything here is commented out: what is not written stays as Main set it.
#
# The keys are the ones tsbWEB itself reads, and they are German. They are not this project's
# to rename: titel, thema, leerlauf.minuten, sitzungen.max, zertifikat.

# port = 8099
# titel = RapidX ERP
# thema = FlatLightLaf
# leerlauf.minuten = 30

# There is no session ceiling by default. A session is created for every visitor, signed in or
# not, so any number small enough to protect memory is small enough for a crawler to fill - and
# then real users are the ones turned away. What protects the process is the idle timeout above.
# sitzungen.max = 750

# The theme may be one of hell / dunkel / intellij / darcula, or the name of any FlatLaf class -
# FlatDarkLaf, FlatArcDarkIJTheme. All forty-six ported IntelliJ themes are in lib/, and picking
# one in the designer writes it into Sub Main.
#
# It is not decoration: the server paints every component with this look and feel and sends the
# drawing, so it is what the browser shows.

# HTTPS. Without a certificate the server runs unencrypted, which is not all right anywhere but
# localhost: a session cookie sent over HTTP can be read by anyone on the network.
# zertifikat = zertifikat.p12
#
# The password does not belong in this file - it survives every backup and every copy. Set the
# environment variable TSBWEB_ZERT_PASSWORT instead.
# zertifikat.passwort =
