# Two pages, and the stack between them.
#
# Run it on this machine in a phone-sized window, which is what you will use most:
#     rfxmobile swing .
# Or on a device:
#     rfxmobile android .
#     rfxmobile ios .
#
# The manifest, the Info.plist and the entry point are generated from these lines,
# including the permissions, which are read out of the compiled forms.

name    = Two pages
form    = PageOne
package = de.example.pages

titlebar    = off
orientation = portrait
