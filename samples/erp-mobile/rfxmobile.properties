# The ERP on Android and iOS — the same forms, the same renderer.
#
# This is the example for the Swing route: `rfxmobile android` and `rfxmobile ios` build two
# applications out of exactly these 19 forms that look the same pixel for pixel. On both, FlatLaf
# does the drawing through the java.desktop port — on Android through android.graphics.Canvas, on
# iOS through CoreGraphics.
#
# There is a second version of this application, kept in the product repository rather than
# published: it builds the same screens through android.widget instead of the Swing route. Having
# the two side by side is deliberate — the older route stays the fallback, and comparing two
# running applications is worth more than any description of the difference.

name = ERP Mobile
form = SignInForm
package = de.tsb.erpmobile


# Off, and for a reason: a Swing form brings its own heading, and the bar would take height away
# without adding anything. The android.widget version keeps it on, because there the list screens
# carry their name in the bar and nowhere else.
titlebar = off

# The appearance to start with.
#
# Empty or missing means: follow the device — if the phone is set to dark, the application starts
# dark. A theme is stated explicitly here, because that is the more common case as soon as an
# application brings colours of its own. Allowed are the names from App.themes() (Light, Dark,
# IntelliJ, Darcula) and the class names of the 46 IntelliJ themes.
theme = com.formdev.flatlaf.intellijthemes.FlatArcDarkIJTheme
